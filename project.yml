name: BuildCalc
options:
  bundleIdPrefix: com.gma
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  BuildCalc:
    type: application
    platform: iOS
    sources:
      - path: BuildCalc
    resources:
      - path: BuildCalc/Resources/PrivacyInfo.xcprivacy
      - path: BuildCalc/Resources/LaunchScreen.storyboard
      - path: BuildCalc/Resources/Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.gma.app
        PRODUCT_NAME: BuildCalc
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        UILaunchStoryboardName: LaunchScreen
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiredDeviceCapabilities:
          - arm64
        INFOPLIST_KEY_UIDeviceFamily: [1]
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDarkContent
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
