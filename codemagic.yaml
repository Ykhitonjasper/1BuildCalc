workflows:
  ios-workflow:
    name: iOS Workflow (simulator, no signing)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: BuildCalc.xcodeproj
        XCODE_SCHEME: BuildCalc
    scripts:
      - name: Build iOS (simulator)
        script: |
          set -e
          xcodebuild \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  ios-release:
    name: iOS signed IPA (App Store)
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: buildcalc_app_store_connect
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: BuildCalc.xcodeproj
        XCODE_SCHEME: BuildCalc
        BUNDLE_ID: com.stevethomas.Buildcalc
        APP_STORE_APPLE_ID: "6769450205"
    scripts:
      - name: Set up keychain for code signing
        script: keychain initialize
      - name: Fetch signing files (App Store profile + certificate)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --archive-method app-store
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
